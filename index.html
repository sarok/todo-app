<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🌿 My Todos</h1>
      <p class="subtitle">Stay grounded. Get things done.</p>
    </header>

    <!-- Add Todo Form -->
    <section class="add-todo">
      <h2>Add a Task</h2>
      <form id="todo-form">
        <div class="form-row">
          <input
            type="text"
            id="todo-input"
            placeholder="What needs to be done?"
            autocomplete="off"
            required
          />
        </div>
        <div class="form-row form-meta">
          <div class="form-group">
            <label for="todo-due">Due Date</label>
            <input type="date" id="todo-due" />
          </div>
          <div class="form-group">
            <label for="todo-category">Category</label>
            <select id="todo-category">
              <option value="">None</option>
              <option value="work">Work</option>
              <option value="personal">Personal</option>
              <option value="shopping">Shopping</option>
              <option value="health">Health</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="todo-priority">Priority</label>
            <select id="todo-priority">
              <option value="normal">Normal</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
          </div>
        </div>
        <button type="submit" id="add-btn">Add Task</button>
      </form>
    </section>

    <!-- Filters -->
    <section class="filters">
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <div class="filter-group">
        <select id="category-filter">
          <option value="">All Categories</option>
          <option value="work">Work</option>
          <option value="personal">Personal</option>
          <option value="shopping">Shopping</option>
          <option value="health">Health</option>
          <option value="other">Other</option>
        </select>
      </div>
      <button id="clear-completed" title="Clear all completed tasks">Clear Completed</button>
    </section>

    <!-- Stats -->
    <div class="stats">
      <span id="stats-text">0 tasks</span>
    </div>

    <!-- Todo List -->
    <section class="todo-list-section">
      <ul id="todo-list" aria-label="Todo list"></ul>
      <div id="empty-state" class="empty-state" hidden>
        <p>No tasks here. Add one above!</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
