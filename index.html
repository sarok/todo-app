<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All-In-All App</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="shortcut icon" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">

    <header>
      <h1>All-In-All App</h1>
      <p class="subtitle">Your tasks and home, all in one place.</p>
    </header>

    <!-- ═══════════════════════════════════════════════════════
         SECTION 1 — TO DO
    ════════════════════════════════════════════════════════ -->
    <div class="section-label">Section 1 — To Do</div>

    <!-- Add Todo Form -->
    <section class="add-todo">
      <h2>Add a Task</h2>
      <form id="todo-form">
        <div class="form-row">
          <input
            type="text"
            id="todo-input"
            placeholder="What needs to be done?"
            autocomplete="off"
            required
          />
        </div>
        <div class="form-row form-meta">
          <div class="form-group">
            <label for="todo-due">Due Date</label>
            <input type="date" id="todo-due" />
          </div>
          <div class="form-group">
            <label for="todo-category">Category</label>
            <select id="todo-category">
              <option value="">None</option>
              <option value="work">Work</option>
              <option value="personal">Personal</option>
              <option value="shopping">Shopping</option>
              <option value="health">Health</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="todo-priority">Priority</label>
            <select id="todo-priority">
              <option value="normal">Normal</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
          </div>
        </div>
        <button type="submit" id="add-btn">Add Task</button>
      </form>
    </section>

    <!-- Filters bar -->
    <section class="filters">
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <div class="filter-group">
        <select id="category-filter">
          <option value="">All Categories</option>
          <option value="work">Work</option>
          <option value="personal">Personal</option>
          <option value="shopping">Shopping</option>
          <option value="health">Health</option>
          <option value="other">Other</option>
        </select>
      </div>
      <button id="clear-completed" title="Clear all completed tasks">Clear Completed</button>
    </section>

    <!-- Stats -->
    <div class="stats">
      <span id="stats-text">No tasks yet</span>
    </div>

    <!-- Todo List -->
    <section class="todo-list-section">
      <ul id="todo-list" aria-label="Todo list"></ul>
      <div id="empty-state" class="empty-state" hidden>
        <p>No tasks here. Add one above!</p>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════
         SECTION 2 — FILTER TRACKER
    ════════════════════════════════════════════════════════ -->
    <div class="section-label">Section 2 — Filter Tracker</div>

    <section class="hf-section">
      <div class="hf-header">
        <div>
          <h2 class="hf-title">🏠 Home Filter Tracker</h2>
          <p class="hf-subtitle">Track when your home filters need changing</p>
        </div>
        <button id="hf-add-btn">+ Add Filter</button>
      </div>

      <!-- Add / Edit Form (hidden by default) -->
      <div id="hf-form-wrap" class="hf-form-wrap" hidden>
        <div class="hf-form-row">
          <div class="form-group">
            <label for="hf-name">Filter Name</label>
            <input type="text" id="hf-name" placeholder="e.g. HVAC, Water, Range Hood" autocomplete="off" />
          </div>
          <div class="form-group">
            <label for="hf-last-changed">Last Changed</label>
            <input type="date" id="hf-last-changed" />
          </div>
          <div class="form-group">
            <label for="hf-interval">Change Every (months)</label>
            <input type="number" id="hf-interval" min="1" max="24" placeholder="e.g. 3" />
          </div>
        </div>
        <div class="hf-form-actions">
          <button id="hf-save-btn">Save Filter</button>
          <button id="hf-cancel-btn" class="hf-cancel">Cancel</button>
        </div>
      </div>

      <!-- Filter list -->
      <div id="hf-list"></div>
      <div id="hf-empty" class="hf-empty" hidden>
        <p>No filters tracked yet. Add one above!</p>
      </div>
    </section>

  </div><!-- /.container -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore, collection, addDoc, deleteDoc,
      updateDoc, doc, query, orderBy, onSnapshot,
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyALXwtSW4ij7h8ExsHDOYG0R6HjX12IiLc",
      authDomain: "saro-todo.firebaseapp.com",
      projectId: "saro-todo",
      storageBucket: "saro-todo.firebasestorage.app",
      messagingSenderId: "734271210915",
      appId: "1:734271210915:web:ae05ab1eb019ea1e35c616"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const db          = getFirestore(firebaseApp);
    const todosCol    = collection(db, "todos");

    // ── Section 1: To Do ──────────────────────────────────────
    let todos               = [];
    let activeFilter        = 'all';
    let activeCategoryFilter = '';

    const form           = document.getElementById('todo-form');
    const todoInput      = document.getElementById('todo-input');
    const dueInput       = document.getElementById('todo-due');
    const categorySelect = document.getElementById('todo-category');
    const prioritySelect = document.getElementById('todo-priority');
    const todoList       = document.getElementById('todo-list');
    const emptyState     = document.getElementById('empty-state');
    const statsText      = document.getElementById('stats-text');
    const filterBtns     = document.querySelectorAll('.filter-btn');
    const categoryFilter = document.getElementById('category-filter');
    const clearCompleted = document.getElementById('clear-completed');

    function getDueStatus(dueDate) {
      if (!dueDate) return null;
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const due = new Date(dueDate + 'T00:00:00');
      if (due < today) return 'overdue';
      if (due.getTime() === today.getTime()) return 'due-today';
      return 'upcoming';
    }

    function formatDueDate(dueDate) {
      if (!dueDate) return '';
      return new Date(dueDate + 'T00:00:00').toLocaleDateString(undefined, {
        month: 'short', day: 'numeric', year: 'numeric'
      });
    }

    function getFilteredTodos() {
      return todos.filter(todo => {
        const matchesStatus =
          activeFilter === 'all' ||
          (activeFilter === 'active'    && !todo.completed) ||
          (activeFilter === 'completed' &&  todo.completed);
        const matchesCategory = !activeCategoryFilter || todo.category === activeCategoryFilter;
        return matchesStatus && matchesCategory;
      });
    }

    function renderTodos() {
      const filtered = getFilteredTodos();
      todoList.innerHTML = '';
      emptyState.hidden  = filtered.length > 0;
      filtered.forEach(todo => todoList.appendChild(buildTodoItem(todo)));
      updateStats();
    }

    function buildTodoItem(todo) {
      const li = document.createElement('li');
      li.className = 'todo-item' + (todo.completed ? ' completed' : '');

      const checkbox = document.createElement('input');
      checkbox.type  = 'checkbox';
      checkbox.className = 'todo-checkbox';
      checkbox.checked   = todo.completed;
      checkbox.setAttribute('aria-label', `Mark "${todo.text}" as ${todo.completed ? 'incomplete' : 'complete'}`);
      checkbox.addEventListener('change', () => toggleTodo(todo.id, todo.completed));

      const content  = document.createElement('div');
      content.className = 'todo-content';

      const textEl   = document.createElement('span');
      textEl.className  = 'todo-text';
      textEl.textContent = todo.text;

      const meta = document.createElement('div');
      meta.className = 'todo-meta';

      if (todo.category) {
        const b = document.createElement('span');
        b.className   = 'badge badge-category';
        b.textContent = todo.category;
        meta.appendChild(b);
      }
      if (todo.priority && todo.priority !== 'normal') {
        const b = document.createElement('span');
        b.className   = `badge badge-priority-${todo.priority}`;
        b.textContent = todo.priority + ' priority';
        meta.appendChild(b);
      }
      if (todo.dueDate) {
        const status = getDueStatus(todo.dueDate);
        const b = document.createElement('span');
        b.className = 'badge badge-due' +
          (status === 'overdue'   ? ' overdue'   :
           status === 'due-today' ? ' due-today' : '');
        const label = status === 'overdue'   ? '⚠ Overdue · ' :
                      status === 'due-today' ? '⏰ Today · '   : '📅 ';
        b.textContent = label + formatDueDate(todo.dueDate);
        meta.appendChild(b);
      }

      content.appendChild(textEl);
      if (meta.children.length > 0) content.appendChild(meta);

      const createdEl = document.createElement('span');
      createdEl.className   = 'todo-created';
      createdEl.textContent = todo.createdAt
        ? new Date(todo.createdAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })
        : '';

      const deleteBtn = document.createElement('button');
      deleteBtn.className   = 'todo-delete';
      deleteBtn.textContent = '✕';
      deleteBtn.setAttribute('aria-label', `Delete "${todo.text}"`);
      deleteBtn.addEventListener('click', () => deleteTodo(todo.id));

      li.appendChild(checkbox);
      li.appendChild(content);
      li.appendChild(createdEl);
      li.appendChild(deleteBtn);
      return li;
    }

    function updateStats() {
      const total     = todos.length;
      const completed = todos.filter(t => t.completed).length;
      statsText.textContent = total === 0
        ? 'No tasks yet'
        : `${total - completed} active · ${completed} completed · ${total} total`;
    }

    async function addTodo(text, dueDate, category, priority) {
      await addDoc(todosCol, {
        text: text.trim(), completed: false,
        dueDate: dueDate || '', category: category || '',
        priority: priority || 'normal', createdAt: Date.now(),
      });
    }

    async function toggleTodo(id, currentState) {
      await updateDoc(doc(db, "todos", id), { completed: !currentState });
    }

    async function deleteTodo(id) {
      await deleteDoc(doc(db, "todos", id));
    }

    async function clearCompletedTodos() {
      const completed = todos.filter(t => t.completed);
      if (!completed.length) return;
      if (!confirm(`Remove ${completed.length} completed task${completed.length > 1 ? 's' : ''}?`)) return;
      await Promise.all(completed.map(t => deleteDoc(doc(db, "todos", t.id))));
    }

    // Real-time listener for todos
    const todosQuery = query(todosCol, orderBy("createdAt", "desc"));
    onSnapshot(todosQuery, snapshot => {
      todos = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      renderTodos();
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const text = todoInput.value.trim();
      if (!text) return;
      const btn = document.getElementById('add-btn');
      btn.disabled = true; btn.textContent = 'Adding…';
      await addTodo(text, dueInput.value, categorySelect.value, prioritySelect.value);
      todoInput.value = ''; dueInput.value = '';
      categorySelect.value = ''; prioritySelect.value = 'normal';
      btn.disabled = false; btn.textContent = 'Add Task';
      todoInput.focus();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        renderTodos();
      });
    });

    categoryFilter.addEventListener('change', () => {
      activeCategoryFilter = categoryFilter.value;
      renderTodos();
    });

    clearCompleted.addEventListener('click', clearCompletedTodos);

    // ── Section 2: Filter Tracker ─────────────────────────────
    const hfCol           = collection(db, "homeFilters");
    const hfAddBtn        = document.getElementById('hf-add-btn');
    const hfFormWrap      = document.getElementById('hf-form-wrap');
    const hfNameInput     = document.getElementById('hf-name');
    const hfLastInput     = document.getElementById('hf-last-changed');
    const hfIntervalInput = document.getElementById('hf-interval');
    const hfSaveBtn       = document.getElementById('hf-save-btn');
    const hfCancelBtn     = document.getElementById('hf-cancel-btn');
    const hfList          = document.getElementById('hf-list');
    const hfEmpty         = document.getElementById('hf-empty');

    let homeFilters = [];
    let editingHfId = null;

    hfAddBtn.addEventListener('click', () => {
      editingHfId = null;
      hfNameInput.value = ''; hfLastInput.value = ''; hfIntervalInput.value = '';
      hfSaveBtn.textContent = 'Save Filter';
      hfFormWrap.hidden = false;
      hfNameInput.focus();
    });

    hfCancelBtn.addEventListener('click', () => {
      hfFormWrap.hidden = true;
      editingHfId = null;
    });

    hfSaveBtn.addEventListener('click', async () => {
      const name     = hfNameInput.value.trim();
      const lastDate = hfLastInput.value;
      const interval = parseInt(hfIntervalInput.value);
      if (!name || !lastDate || !interval || interval < 1) {
        alert('Please fill in all three fields.');
        return;
      }
      hfSaveBtn.disabled = true; hfSaveBtn.textContent = 'Saving…';
      if (editingHfId) {
        await updateDoc(doc(db, "homeFilters", editingHfId), { name, lastChanged: lastDate, intervalMonths: interval });
      } else {
        await addDoc(hfCol, { name, lastChanged: lastDate, intervalMonths: interval, createdAt: Date.now() });
      }
      hfFormWrap.hidden = true;
      editingHfId = null;
      hfSaveBtn.disabled = false; hfSaveBtn.textContent = 'Save Filter';
    });

    function getHfStatus(lastChanged, intervalMonths) {
      const last = new Date(lastChanged + 'T00:00:00');
      const next = new Date(last);
      next.setMonth(next.getMonth() + intervalMonths);
      const today   = new Date(); today.setHours(0, 0, 0, 0);
      const diffDays = Math.ceil((next - today) / (1000 * 60 * 60 * 24));
      return { next, diffDays };
    }

    function renderHomeFilters() {
      hfList.innerHTML = '';
      if (homeFilters.length === 0) { hfEmpty.hidden = false; return; }
      hfEmpty.hidden = true;

      homeFilters.forEach(hf => {
        const { next, diffDays } = getHfStatus(hf.lastChanged, hf.intervalMonths);
        let statusClass = 'hf-status-ok';
        let statusText  = `Due in ${diffDays} day${diffDays !== 1 ? 's' : ''}`;
        if (diffDays <= 0) {
          statusClass = 'hf-status-overdue';
          statusText  = diffDays === 0 ? '⚠ Due today!' : `⚠ Overdue by ${Math.abs(diffDays)} day${Math.abs(diffDays) !== 1 ? 's' : ''}`;
        } else if (diffDays <= 14) {
          statusClass = 'hf-status-soon';
          statusText  = `⏰ Due soon — ${diffDays} day${diffDays !== 1 ? 's' : ''}`;
        }

        const card = document.createElement('div');
        card.className = 'hf-card';
        card.innerHTML = `
          <div class="hf-card-left">
            <div class="hf-card-name">${hf.name}</div>
            <div class="hf-card-meta">
              <span>Last changed: <strong>${new Date(hf.lastChanged + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}</strong></span>
              <span>·</span>
              <span>Every <strong>${hf.intervalMonths} month${hf.intervalMonths !== 1 ? 's' : ''}</strong></span>
              <span>·</span>
              <span>Next: <strong>${next.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}</strong></span>
            </div>
          </div>
          <div class="hf-card-right">
            <span class="hf-status ${statusClass}">${statusText}</span>
            <div class="hf-actions">
              <button class="hf-edit-btn" aria-label="Edit ${hf.name}">✎</button>
              <button class="hf-delete-btn" aria-label="Delete ${hf.name}">✕</button>
            </div>
          </div>`;

        card.querySelector('.hf-edit-btn').addEventListener('click', () => {
          editingHfId = hf.id;
          hfNameInput.value = hf.name;
          hfLastInput.value = hf.lastChanged;
          hfIntervalInput.value = hf.intervalMonths;
          hfSaveBtn.textContent = 'Update Filter';
          hfFormWrap.hidden = false;
          hfNameInput.focus();
        });

        card.querySelector('.hf-delete-btn').addEventListener('click', async () => {
          if (!confirm(`Delete "${hf.name}"?`)) return;
          await deleteDoc(doc(db, "homeFilters", hf.id));
        });

        hfList.appendChild(card);
      });
    }

    // Real-time listener for home filters
    const hfQuery = query(hfCol, orderBy("createdAt", "asc"));
    onSnapshot(hfQuery, snapshot => {
      homeFilters = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      renderHomeFilters();
    });

  </script>
</body>
</html>
